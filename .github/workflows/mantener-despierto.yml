name: Mantener despierto el backend en Render

# Render (plan Free) duerme el servicio despues de un rato sin trafico HTTP,
# y al despertar arranca con la base vacia (sin disco persistente -- ver
# README.md, seccion "Deploy"). Este ping periodico evita ESE dormir por
# inactividad; NO evita el reset que igual pasa con cada redeploy (eso solo
# se arregla con un plan con disco persistente).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingear el backend
        run: |
          # Si Render estaba dormido, despertar puede tardar mas que
          # --max-time y curl corta con timeout (exit distinto de 0) --
          # sin el "|| true" al final, eso hacia fallar el job entero y
          # mandaba un mail de error por cada ping que encontraba el
          # backend dormido, que es exactamente el caso que este workflow
          # existe para cubrir.
          if code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 50 https://formulario7.onrender.com/api/sesion); then
            echo "Respuesta del backend: HTTP $code"
          else
            echo "El backend no respondio a tiempo (estaba dormido, probablemente ya despertando)."
          fi
          true
