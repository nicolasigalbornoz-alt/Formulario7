<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario 7 -- Ingreso</title>
<link rel="icon" href="img/favicon-moron.png">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-layout">
  <div class="login-brand-panel">
    <div class="login-logo"><img src="img/logo-moron.png" alt="Municipio de Morón"></div>
    <div>
      <h1>Formulario 7</h1>
      <p>Programación Anual de Compras de Bienes y Contrataciones de Servicios</p>
    </div>
    <div class="login-photo-caption">Plaza Alte. Brown -- Morón</div>
  </div>

  <div class="login-form-panel">
    <div class="card login-card">
      <h1>Ingresar</h1>
      <p class="card-desc">Presupuesto 2027 -- Municipalidad de Morón</p>

      <div id="alerta"></div>

      <form id="form-login">
        <div class="campo">
          <label for="username">Usuario</label>
          <input type="text" id="username" name="username" autocomplete="username" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary" id="btn-entrar" style="width:100%; justify-content:center;">Ingresar</button>
      </form>
    </div>
  </div>
</div>

<footer class="soporte" id="footer-soporte"></footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
