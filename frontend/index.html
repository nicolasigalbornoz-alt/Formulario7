<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario 7 -- Ingreso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="login-wrap">
  <div class="card login-card">
    <h1>Formulario 7</h1>
    <p class="card-desc">Programación Anual de Compras de Bienes y Contrataciones de Servicios -- Municipalidad de Morón</p>

    <div id="alerta"></div>

    <form id="form-login">
      <div class="campo">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" id="btn-entrar" style="width:100%; justify-content:center;">Ingresar</button>
    </form>
  </div>
</div>

<footer class="soporte" id="footer-soporte"></footer>

<script src="js/api.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
